# Render Blueprint: UN servicio.
#  - buddys (Web Service): la API de Node (Express) del sistema interno de Buddys Wash Detail. No hay web: el
#    frontend se hará más adelante con otro diseño y se conectará a esta API (ver backend/README.md).
#    En el plan gratis se duerme tras 15 min sin pedidos; el primer pedido la despierta.
# Uso: en Render, New > Blueprint, elegir este repo (o, si ya existe, "Sync" del Blueprint). Las variables con
# `sync: false` se cargan a mano en el panel de Render (son secretos o datos tuyos): nunca van al repo. Detalle de cada
# una en backend/.env.example.
#
# Dominio provisorio de la API: api.buddyswashdetail.com.ar (COMPLETAR con el dominio real).
services:
  # ---------------------------------------------------------------------------------------------------------------
  # Backend: la API (Web Service)
  # ---------------------------------------------------------------------------------------------------------------
  - type: web
    name: buddys
    runtime: node
    # Poné la región más cercana a tu proyecto de Supabase (menos demora entre la API y la base).
    region: virginia
    # Plan gratis: se duerme tras 15 min sin pedidos (el primero espera ~30-60 s). Un monitor gratis (UptimeRobot,
    # cada 10 min a https://api.buddyswashdetail.com.ar/api/health) lo mantiene despierto. Cuando haya clientes, cambiá a
    # `starter` (~US$7/mes, no se duerme) y volvé a sincronizar el Blueprint.
    plan: free
    # NODE_ENV=production hace que `npm ci` salte las devDependencies (typescript), que el build necesita.
    buildCommand: npm --prefix backend ci --include=dev && npm --prefix backend run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # Solo se vuelve a publicar si cambia algo del backend.
    buildFilter:
      paths:
        - backend/**
        - package.json
        - .node-version
    domains:
      - api.buddyswashdetail.com.ar
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Render llega al proceso desde afuera: hay que escuchar en todas las interfaces.
      - key: HOST
        value: 0.0.0.0
      # Sistema interno: las rutas públicas de turnos (landing) quedan apagadas. true las vuelve a montar.
      - key: TURNOS_ONLINE
        value: "false"
      # Un proxy inverso (el de Render) entre el visitante y la API: para que el límite de pedidos vea la IP real.
      - key: TRUST_PROXY
        value: "1"
      # Orígenes exactos del frontend que va a usar esta API (esquema + host, sin barra final), separados por coma.
      # Los usan CORS y la defensa CSRF. Hoy no hay frontend: cuando exista, cargá su dominio acá.
      - key: FRONTEND_ORIGIN
        sync: false
      # Dirección pública del panel (links en los avisos). Opcional hasta que exista el frontend.
      - key: PUBLIC_URL
        sync: false
      # El certificado raíz de Supabase ya está en el repo (backend/certs).
      - key: DATABASE_SSL_CA_FILE
        value: ./certs/supabase-ca.crt
      # --- Secretos / datos tuyos: se cargan en el panel de Render ---
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Opcional: que el superadmin cree y elimine usuarios desde el panel.
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Avisos push al celular (las tres juntas o ninguna).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
