# Render Blueprint: UN servicio, panel y API juntos.
#  - buddys (Web Service): el proceso de Node (Express) sirve la API en /api y el panel web compilado (frontend/dist,
#    PANEL_DIR) en el resto de las rutas. Un solo origen, como necesita el panel (llama a /api relativo con cookies
#    SameSite=Strict). En el plan gratis se duerme tras 15 min sin pedidos; el primer pedido la despierta.
# Uso: en Render, New > Blueprint, elegir este repo (o, si ya existe, "Sync" del Blueprint). Las variables con
# `sync: false` se cargan a mano en el panel de Render (son secretos o datos tuyos): nunca van al repo. Detalle de cada
# una en backend/.env.example.
#
# Dirección: la que asigna Render (https://<nombre>.onrender.com). FRONTEND_ORIGIN y PUBLIC_URL llevan esa misma
# dirección. Un dominio propio (ej. panel.buddyswashdetail.com.ar) se suma después en Settings > Custom Domains, y
# entonces se agrega a FRONTEND_ORIGIN.
services:
  - type: web
    name: buddys
    runtime: node
    # Poné la región más cercana a tu proyecto de Supabase (menos demora entre la API y la base).
    region: virginia
    # Plan gratis: se duerme tras 15 min sin pedidos (el primero espera ~30-60 s). Antes de mostrarlo, abrilo un minuto
    # antes, o usá un monitor gratis (UptimeRobot, cada 10 min a /api/health). Para uso diario, `starter` (~US$7/mes).
    plan: free
    # NODE_ENV=production hace que `npm ci` salte las devDependencies (typescript, vite), que el build necesita.
    buildCommand: >-
      npm --prefix backend ci --include=dev && npm --prefix backend run build &&
      npm --prefix frontend ci --include=dev && npm --prefix frontend run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # Se vuelve a publicar si cambia el backend o el panel.
    buildFilter:
      paths:
        - backend/**
        - frontend/**
        - package.json
        - .node-version
    envVars:
      # El panel compilado (relativo a backend/): lo sirve este mismo proceso fuera de /api.
      - key: PANEL_DIR
        value: ../frontend/dist
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Render llega al proceso desde afuera: hay que escuchar en todas las interfaces.
      - key: HOST
        value: 0.0.0.0
      # Sistema interno: las rutas públicas de turnos (landing) quedan apagadas. true las vuelve a montar.
      - key: TURNOS_ONLINE
        value: "false"
      # Un proxy inverso (el de Render) entre el visitante y la API: para que el límite de pedidos vea la IP real.
      - key: TRUST_PROXY
        value: "1"
      # La dirección pública exacta del servicio (https://<nombre>.onrender.com, sin barra final). La usan CORS y la
      # defensa CSRF: si no coincide con la que ve el navegador, todos los POST/PATCH/DELETE dan 403.
      - key: FRONTEND_ORIGIN
        sync: false
      # La misma dirección (links al panel en los avisos).
      - key: PUBLIC_URL
        sync: false
      # El certificado raíz de Supabase ya está en el repo (backend/certs).
      - key: DATABASE_SSL_CA_FILE
        value: ./certs/supabase-ca.crt
      # --- Secretos / datos tuyos: se cargan en el panel de Render ---
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Opcional: que el superadmin cree y elimine usuarios desde el panel.
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Avisos push al celular (las tres juntas o ninguna).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
